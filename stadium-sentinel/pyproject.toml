[project]
name = "stadium-sentinel"
version = "0.1.0"
description = "Agentic crowd-intelligence and emergency-command platform for cricket stadiums"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.13.3",
  "redis==5.2.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==3.2.0",
  "google-cloud-aiplatform==1.71.1",
  "google-generativeai==0.8.3",
  "geoalchemy2==0.15.2",
  "slowapi==0.1.9",
  "orjson==3.10.11",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0", "ruff==0.7.2"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
