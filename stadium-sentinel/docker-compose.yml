services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data

  api:
    build: .
    env_file: .env
    environment:
      - POSTGRES_DSN=postgresql+asyncpg://sentinel:sentinel@db:5432/sentinel
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8080:8080"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2

  agent:
    build: .
    env_file: .env
    environment:
      - POSTGRES_DSN=postgresql+asyncpg://sentinel:sentinel@db:5432/sentinel
      - REDIS_URL=redis://redis:6379/0
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: python -m app.agents.runner
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
